<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fotos do Imóvel</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0e0e10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --card: #18181b;
      --txt: #f4f4f5;
      --mut: #9a9aa3;
      --verde: #25D366;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100dvh;
      overscroll-behavior-y: none;
      display: flex;
      flex-direction: column;
    }
    #conteudo { flex: 1; flex-direction: column; min-width: 0; }

    .wrap { max-width: 760px; margin: 0 auto; min-width: 0; width: 100%; }

    #loading, #erro {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80dvh;
      gap: 14px;
      color: var(--mut);
      text-align: center;
      padding: 2rem;
    }
    #loading { display: flex; }
    #erro span { font-size: 3rem; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid #2a2a30;
      border-top-color: var(--verde);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #conteudo { display: none; }

    /* ── Cabeçalho ── */
    .header { padding: 16px 16px 12px; }
    .titulo {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(17px, 4.8vw, 23px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.4px;
      line-height: 1.25;
    }
    .subtitulo { font-size: 13px; color: var(--mut); margin-top: 4px; }

    /* ── Palco (moldura fixa: não pula entre fotos) ── */
    .palco {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      width: auto;
      aspect-ratio: var(--ar, 4 / 3);
      max-height: min(72svh, 680px);
      margin: 0 16px;
    }
    @media (max-width: 640px) {
      .palco { border-radius: 0; margin: 0; max-height: min(68svh, 620px); }
    }

    .trilho {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .trilho::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      height: 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── Setas (só em tela grande) ── */
    .seta {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .seta:hover { background: rgba(0,0,0,0.82); }
    .seta-esq { left: 10px; }
    .seta-dir { right: 10px; }
    @media (min-width: 641px) and (hover: hover) {
      .seta { display: flex; }
    }

    .contador {
      position: absolute;
      bottom: 12px; right: 12px;
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 5;
    }

    .ampliar {
      position: absolute;
      bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.62);
      color: #fff;
      border: none;
      font-size: 15px;
      padding: 6px 11px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    /* ── Miniaturas ── */
    .miniaturas {
      display: flex;
      min-width: 0;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .miniaturas::-webkit-scrollbar { display: none; }
    .miniatura {
      width: 58px; height: 58px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, opacity 0.2s;
      flex: 0 0 auto;
      opacity: 0.5;
      background: var(--card);
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .miniatura.ativa { border-color: var(--verde); opacity: 1; }
    .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Barra fixa de ações ── */
    .barra {
      position: sticky;
      bottom: 0;
      margin-top: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 55%, rgba(14,14,16,0.86) 80%, rgba(14,14,16,0));
    }
    .barra-in {
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn:active { filter: brightness(0.9); }
    .btn-primario {
      flex: 1 1 210px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff;
      box-shadow: 0 8px 22px rgba(37,211,102,0.26);
    }
    .btn-secundario {
      flex: 0 1 auto;
      background: #1f1f24;
      color: var(--txt);
      border: 1px solid #2e2e36;
      font-size: 14px;
      padding: 14px 15px;
    }
    @media (max-width: 640px) {
      .btn-primario { flex: 1 1 100%; }
      .btn-secundario { flex: 1 1 0; }
    }
    .btn:disabled { background: #2a2a30; box-shadow: none; cursor: default; color: var(--mut); border-color: #2a2a30; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando fotos...</p>
  </div>

  <div id="erro">
    <span>📷</span>
    <p style="font-size:18px;font-weight:700;color:#f4f4f5;">Imóvel não encontrado</p>
    <p>O link pode estar desatualizado ou as fotos foram removidas.</p>
  </div>

  <div id="conteudo">
    <div class="wrap">
      <div class="header">
        <div class="titulo" id="titulo">Fotos do imóvel</div>
        <div class="subtitulo" id="subtitulo"></div>
      </div>
    </div>

    <div class="wrap">
      <div class="palco">
        <div class="trilho" id="trilho"></div>
        <button class="seta seta-esq" id="setaEsq" aria-label="Anterior">&#8249;</button>
        <button class="seta seta-dir" id="setaDir" aria-label="Próxima">&#8250;</button>
        <a class="ampliar" id="ampliar" target="_blank" rel="noopener" aria-label="Abrir foto em tamanho real">⤢</a>
        <div class="contador" id="contador">1 / 1</div>
      </div>

      <div class="miniaturas" id="miniaturas"></div>
    </div>
  </div>

  <div class="barra" id="barra" style="display:none">
    <div class="barra-in">
      <button class="btn btn-primario" id="btnTodas">⬇️ Baixar todas</button>
      <button class="btn btn-secundario" id="btnAlternativo">ZIP</button>
      <button class="btn btn-secundario" id="btnBaixarUma">Esta foto</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8Jq17jELr17zonEVmLRjy-p7dmeLLskw",
      authDomain: "estoque-53f1e.firebaseapp.com",
      projectId: "estoque-53f1e",
      storageBucket: "estoque-53f1e.firebasestorage.app",
      messagingSenderId: "265114904725",
      appId: "1:265114904725:web:c97ac40636b76b6c8f939c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    let fotos = [];
    let atual = 0;
    let tituloImovel = "imovel";

    // ── Referência da URL: /fotos/REF ou /REF ──
    function getRefDaUrl() {
      const partes = window.location.pathname.split('/').filter(Boolean);
      const bruto = (partes[0] === 'fotos' && partes[1]) ? partes[1] : (partes[0] || '');
      try { return decodeURIComponent(bruto); } catch { return bruto; }
    }

    // ── Cloudinary: versão leve pra tela, original pro download ──
    function otimizar(url, transform) {
      const u = String(url || '');
      if (!u.includes('res.cloudinary.com') || !u.includes('/upload/')) return u;
      if (/\/upload\/[a-z]{1,2}_/.test(u)) return u;
      return u.replace('/upload/', '/upload/' + transform + '/');
    }
    const urlGrande = u => otimizar(u, 'f_auto,q_auto:good,w_1400,c_limit');
    const urlMini   = u => otimizar(u, 'f_auto,q_auto:eco,w_160,h_160,c_fill');

    function slug(txt) {
      return String(txt || 'imovel')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60) || 'imovel';
    }

    // ── Navegação ──
    function irPara(idx, suave) {
      const total = fotos.length;
      if (!total) return;
      const i = (idx + total) % total;
      const trilho = $('trilho');
      trilho.scrollTo({ left: i * trilho.clientWidth, behavior: suave === false ? 'auto' : 'smooth' });
      marcar(i);
    }

    function marcar(i) {
      if (i === atual) return;
      atual = i;
      $('contador').textContent = (i + 1) + ' / ' + fotos.length;
      $('ampliar').href = fotos[i];
      document.querySelectorAll('.miniatura').forEach((m, k) => {
        const ativa = k === i;
        m.classList.toggle('ativa', ativa);
        if (ativa) m.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    }

    // ── Download ──
    function salvarBlob(blob, nome) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nome;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
    }

    function carregarJSZip() {
      if (window.JSZip) return Promise.resolve();
      return new Promise((ok, falhou) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = () => window.JSZip ? ok() : falhou(new Error('jszip'));
        s.onerror = () => falhou(new Error('jszip'));
        document.head.appendChild(s);
      });
    }

    function extDe(tipo, url) {
      if (/png/i.test(tipo || '')) return 'png';
      if (/webp/i.test(tipo || '')) return 'webp';
      const m = String(url || '').split('?')[0].match(/\.(jpe?g|png|webp)$/i);
      return m ? m[1].toLowerCase() : 'jpg';
    }

    function nomeFoto(i, tipo) {
      return slug(tituloImovel) + '-' + String(i + 1).padStart(2, '0') + '.' + extDe(tipo, fotos[i]);
    }

    // É celular/tablet de verdade? (o Windows também "compartilha", mas lá o certo é ZIP)
    function ehCelular() {
      const ua = navigator.userAgent || '';
      if (/Android|iPhone|iPad|iPod/i.test(ua)) return true;
      return (navigator.maxTouchPoints || 0) > 1 && /Mac/i.test(navigator.platform || '');
    }

    // O aparelho sabe compartilhar arquivos?
    function podeCompartilhar() {
      try {
        if (!navigator.share || !navigator.canShare || typeof File !== 'function') return false;
        const teste = new File([new Blob(['x'], { type: 'image/jpeg' })], 't.jpg', { type: 'image/jpeg' });
        return navigator.canShare({ files: [teste] });
      } catch { return false; }
    }

    const modoCelular = () => ehCelular() && podeCompartilhar();

    // Baixa todas as fotos pra memória, mostrando o progresso no botão
    async function puxarFotos(btn, rotulo) {
      const blobs = [];
      for (let i = 0; i < fotos.length; i++) {
        btn.textContent = rotulo + ' ' + (i + 1) + '/' + fotos.length + '...';
        const r = await fetch(fotos[i], { mode: 'cors' });
        if (!r.ok) throw new Error('http ' + r.status);
        blobs.push(await r.blob());
      }
      return blobs;
    }

    async function baixarUma(i) {
      const btn = $('btnBaixarUma');
      const antes = btn.textContent;
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const r = await fetch(fotos[i], { mode: 'cors' });
        const blob = await r.blob();
        if (modoCelular()) {
          const arq = new File([blob], nomeFoto(i, blob.type), { type: blob.type || 'image/jpeg' });
          try { await navigator.share({ files: [arq] }); btn.disabled = false; btn.textContent = antes; return; } catch (e) {
            if (e && e.name === 'AbortError') { btn.disabled = false; btn.textContent = antes; return; }
          }
        }
        salvarBlob(blob, nomeFoto(i, blob.type));
      } catch {
        window.open(fotos[i], '_blank', 'noopener');
      }
      btn.disabled = false;
      btn.textContent = antes;
    }

    // ── OPÇÃO CELULAR: manda as fotos pra folha de compartilhamento do aparelho
    // (Salvar em Fotos / WhatsApp / Google Fotos). É o único jeito que presta no telefone.
    async function salvarNoCelular(btn, rotuloFinal) {
      btn.disabled = true;
      try {
        const blobs = await puxarFotos(btn, 'Preparando');
        const arquivos = blobs.map((b, i) => new File([b], nomeFoto(i, b.type), { type: b.type || 'image/jpeg' }));

        const enviar = async () => {
          if (navigator.canShare({ files: arquivos })) {
            await navigator.share({ files: arquivos, title: tituloImovel });
          } else {
            // aparelho limita a quantidade: manda em lotes de 10
            for (let i = 0; i < arquivos.length; i += 10) {
              await navigator.share({ files: arquivos.slice(i, i + 10), title: tituloImovel });
            }
          }
        };

        try {
          await enviar();
        } catch (e) {
          if (e && e.name === 'AbortError') { /* usuário fechou a folha */ }
          else {
            // O navegador exige toque recente: as fotos já estão prontas, é só tocar de novo.
            btn.disabled = false;
            btn.textContent = '📲 Toque para salvar as ' + fotos.length;
            btn.onclick = async () => {
              btn.onclick = null;
              btn.disabled = true;
              try { await enviar(); } catch {}
              btn.disabled = false;
              btn.textContent = rotuloFinal;
              btn.onclick = () => salvarNoCelular(btn, rotuloFinal);
            };
            return;
          }
        }
      } catch (e) {
        console.warn('compartilhar falhou:', e);
        alert('Não consegui preparar as fotos. Tente o botão ZIP.');
      }
      btn.disabled = false;
      btn.textContent = rotuloFinal;
    }

    // ── OPÇÃO PC: um arquivo .zip só
    async function baixarZip(btn, rotuloFinal) {
      btn.disabled = true;
      try {
        await carregarJSZip();
        const blobs = await puxarFotos(btn, 'Preparando');
        const zip = new window.JSZip();
        blobs.forEach((b, i) => zip.file(nomeFoto(i, b.type), b));
        btn.textContent = 'Compactando...';
        const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
        salvarBlob(zipBlob, slug(tituloImovel) + '-fotos.zip');
      } catch (e) {
        console.warn('ZIP falhou, baixando uma a uma:', e);
        await baixarUmaAUma(btn);
      }
      btn.disabled = false;
      btn.textContent = rotuloFinal;
    }

    // ── OPÇÃO SOLTA: as fotos separadas, uma a uma
    // (o Chrome pergunta "permitir vários downloads?" — é só aceitar)
    async function baixarUmaAUma(btn, rotuloFinal) {
      btn.disabled = true;
      for (let i = 0; i < fotos.length; i++) {
        btn.textContent = 'Baixando ' + (i + 1) + '/' + fotos.length + '...';
        try {
          const r = await fetch(fotos[i], { mode: 'cors' });
          const blob = await r.blob();
          salvarBlob(blob, nomeFoto(i, blob.type));
        } catch {}
        await new Promise(seguir => setTimeout(seguir, 700));
      }
      btn.disabled = false;
      if (rotuloFinal) btn.textContent = rotuloFinal;
    }

    // ── Montagem ──
    function montar(imovel) {
      fotos = (imovel.fotos || []).filter(Boolean);
      if (!fotos.length) return mostrarErro();

      tituloImovel = imovel.titulo || 'imovel';
      $('titulo').textContent = imovel.titulo || 'Fotos do imóvel';
      const partes = [imovel.bairro, imovel.cidade].filter(Boolean);
      if (partes.length) $('subtitulo').textContent = partes.join(' · ');

      const trilho = $('trilho');
      const minEl = $('miniaturas');

      fotos.forEach((url, i) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        const img = document.createElement('img');
        img.src = urlGrande(url);
        img.alt = 'Foto ' + (i + 1);
        img.decoding = 'async';
        img.loading = i < 2 ? 'eager' : 'lazy';
        img.draggable = false;
        slide.appendChild(img);
        trilho.appendChild(slide);

        const mini = document.createElement('button');
        mini.className = 'miniatura' + (i === 0 ? ' ativa' : '');
        mini.type = 'button';
        const mimg = document.createElement('img');
        mimg.src = urlMini(url);
        mimg.alt = '';
        mimg.loading = 'lazy';
        mini.appendChild(mimg);
        mini.addEventListener('click', () => irPara(i));
        minEl.appendChild(mini);
      });

      $('contador').textContent = '1 / ' + fotos.length;
      $('ampliar').href = fotos[0];

      // A moldura pega a proporção da 1ª foto e NÃO muda mais: nada pula ao passar as fotos
      const primeira = trilho.querySelector('img');
      const fixarProporcao = () => {
        if (primeira.naturalWidth && primeira.naturalHeight) {
          document.querySelector('.palco').style.setProperty('--ar', primeira.naturalWidth + ' / ' + primeira.naturalHeight);
        }
      };
      if (primeira.complete) fixarProporcao();
      else primeira.addEventListener('load', fixarProporcao, { once: true });

      // Swipe nativo -> só acompanha o scroll pra atualizar contador/miniatura
      let t = null;
      trilho.addEventListener('scroll', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const largura = trilho.clientWidth || 1;
          marcar(Math.max(0, Math.min(fotos.length - 1, Math.round(trilho.scrollLeft / largura))));
        }, 60);
      }, { passive: true });

      // Mantém a foto atual enquadrada ao girar o celular
      let larguraAnterior = trilho.clientWidth;
      window.addEventListener('resize', () => {
        if (trilho.clientWidth === larguraAnterior) return;
        larguraAnterior = trilho.clientWidth;
        trilho.scrollTo({ left: atual * trilho.clientWidth, behavior: 'auto' });
      });

      $('setaEsq').addEventListener('click', () => irPara(atual - 1));
      $('setaDir').addEventListener('click', () => irPara(atual + 1));
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') irPara(atual - 1);
        if (e.key === 'ArrowRight') irPara(atual + 1);
      });

      if (fotos.length <= 1) {
        $('setaEsq').style.display = 'none';
        $('setaDir').style.display = 'none';
        $('contador').style.display = 'none';
        minEl.style.display = 'none';
      }

      // ── Duas opções de baixar tudo, conforme o aparelho ──
      const btnTodas = $('btnTodas');
      const btnAlt = $('btnAlternativo');
      const n = fotos.length;

      if (modoCelular()) {
        // CELULAR: salvar direto na galeria / mandar no WhatsApp
        const rot1 = '📲 Salvar as ' + n + ' fotos';
        const rot2 = 'ZIP';
        btnTodas.textContent = rot1;
        btnAlt.textContent = rot2;
        btnTodas.onclick = () => salvarNoCelular(btnTodas, rot1);
        btnAlt.onclick = () => baixarZip(btnAlt, rot2);
      } else {
        // COMPUTADOR: zip de uma vez, ou as fotos soltas
        const rot1 = '⬇️ Baixar as ' + n + ' fotos (ZIP)';
        const rot2 = 'Uma a uma';
        btnTodas.textContent = rot1;
        btnAlt.textContent = rot2;
        btnTodas.onclick = () => baixarZip(btnTodas, rot1);
        btnAlt.onclick = () => baixarUmaAUma(btnAlt, rot2);
      }

      $('btnBaixarUma').onclick = () => baixarUma(atual);

      $('loading').style.display = 'none';
      $('conteudo').style.display = 'flex';
      $('barra').style.display = 'flex';
    }

    function mostrarErro() {
      $('loading').style.display = 'none';
      $('conteudo').style.display = 'none';
      $('barra').style.display = 'none';
      $('erro').style.display = 'flex';
    }

    // ── Busca o imóvel: por ID e, se não achar, por CÓDIGO ──
    async function buscarImovel(ref) {
      try {
        const snap = await getDoc(doc(db, 'imoveis', ref));
        if (snap.exists()) return { id: snap.id, ...snap.data() };
      } catch (e) { console.warn('busca por id:', e); }

      try {
        const q = query(collection(db, 'imoveis'), where('codigo', '==', ref), limit(1));
        const res = await getDocs(q);
        if (!res.empty) return { id: res.docs[0].id, ...res.docs[0].data() };
      } catch (e) { console.warn('busca por codigo:', e); }

      return null;
    }

    (async () => {
      const ref = getRefDaUrl();
      if (!ref) return mostrarErro();
      const imovel = await buscarImovel(ref);
      if (!imovel) return mostrarErro();
      montar(imovel);
    })();
  </script>
</body>
</html>
